name: Canonical dashboard qualification

on:
  push:
    branches: [codex/hermes-memory-hardening]
    paths:
      - 'dashboard/nextjs-dashboard/**'
      - 'cognee-frontend/**'
      - '.gitignore'
      - 'scripts/apply-braces-depth-backport.mjs'
      - 'scripts/check-braces-depth-backport.mjs'
      - 'scripts/sync-frontend-backports.mjs'
      - '.github/workflows/canonical-dashboard.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory: [dashboard/nextjs-dashboard, cognee-frontend]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install from the committed lock without install hooks
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts
      - name: Check standalone copies match the maintained security backport
        run: node scripts/sync-frontend-backports.mjs --check
      - name: Lint all delivered application source
        working-directory: ${{ matrix.directory }}
        run: npm run lint
      - name: Reproduce the original exploit and verify the bounded source backport
        working-directory: ${{ matrix.directory }}
        run: timeout 15s npm run security:backport
      - name: Build and check TypeScript from the clean checkout
        working-directory: ${{ matrix.directory }}
        run: npm run build
      - name: Check dashboard behavior and credential destination boundaries
        if: matrix.directory == 'dashboard/nextjs-dashboard'
        working-directory: ${{ matrix.directory }}
        run: npm run test:run
      - name: Build the delivered frontend Docker context
        working-directory: ${{ matrix.directory }}
        run: docker build -t frontend:qualification .
      - name: Retain audits and enforce unresolved frontend security findings
        if: always()
        working-directory: ${{ matrix.directory }}
        run: |
          npm audit --json > audit-all.json || audit_exit=$?
          npm audit --omit=dev --json > audit-production.json || production_exit=$?
          node - <<'JS'
          const fs = require('node:fs');
          for (const name of ['audit-all.json', 'audit-production.json']) {
            const report = JSON.parse(fs.readFileSync(name));
            if (report.error || !report.metadata?.vulnerabilities) throw Error('Audit unavailable: ' + name);
            const counts = report.metadata.vulnerabilities;
            console.log(name, counts);
            if (counts.high || counts.critical) process.exitCode = 1;
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-audits-${{ strategy.job-index }}
          path: |
            ${{ matrix.directory }}/audit-all.json
            ${{ matrix.directory }}/audit-production.json

  canonical-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: synthetic-dashboard-ci-only
          POSTGRES_DB: dashboard_qualification
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:8000
      COGNEE_TELEMETRY_ENABLED: '0'
      COGNEE_LOG_FILE: 'false'
      ENHANCED_LOAD_DOTENV: '0'
      RNR_QUALIFICATION_DATABASE_URL: postgresql://postgres:synthetic-dashboard-ci-only@127.0.0.1:5432/dashboard_qualification
      RNR_QUALIFICATION_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked service and browser dependencies
        run: |
          pip install --require-hashes -r requirements-index.lock -r requirements-memory-test.lock
          npm ci --ignore-scripts --prefix dashboard/nextjs-dashboard
          cd dashboard/nextjs-dashboard
          npx --no-install playwright install --with-deps chromium
          npm run build
      - name: Exercise the delivered dashboard with real PostgreSQL and browser
        run: |
          pytest tests/qualification/test_dashboard_browser.py -q --override-ini=addopts= --junitxml=dashboard-browser.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('dashboard-browser.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) > 0
          assert not any(int(s.get(k, 0)) for s in suites for k in ('failures', 'errors', 'skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-dashboard-browser
          path: dashboard-browser.xml
