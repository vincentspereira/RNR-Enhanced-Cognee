# Required CI gate for RNR-Enhanced-Cognee (VIN-39).
# Minimal green-fast lane that mirrors the proven-green Unit Tests job of
# ci-cd-pipeline.yml (run 29220894646: Unit Tests passed in 5m51s) at a
# smaller scope: no service containers, unit tests only, no coverage floor.
# The full pipeline keeps running alongside; its red Lint and Security Audit
# jobs are tracked in VIN-39 and are NOT weakened or duplicated here.
# Growing this gate (services, coverage floor) is follow-up work.
name: Required CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-ci:
    name: Required CI (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock hypothesis
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/unit/ -q \
            -p no:cacheprovider \
            --override-ini="addopts=" \
            --junitxml=junit.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: junit.xml
          retention-days: 14
          if-no-files-found: ignore
