# Required CI gate for RNR-Enhanced-Cognee (VIN-39).
# Unit tests deny outbound networking. A separate step exercises the actual
# legacy install/upgrade SQL against disposable pgvector, without private data.
# This does not establish graph/provider readiness or remote branch protection.
name: Required CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-ci:
    # Preserve the existing check name used by repository branch protection.
    name: Required CI (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: synthetic-schema-qualification-only
          POSTGRES_DB: cognee_schema_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          pip install --require-hashes -r requirements-full.lock
          pip install --require-hashes -r requirements-unit-optional.lock
          pip install hypothesis
          pip install --no-deps -e .

      - name: Check the distributable package boundary
        run: |
          python -m hatchling build -t wheel
          for artifact in dist/*.whl; do python tests/qualification/check_wheel_boundary.py "$artifact"; done

      - name: Run unit tests
        env:
          PYTHONPATH: tests/support/network_guard
          COGNEE_TELEMETRY_ENABLED: '0'
          TELEMETRY_DISABLED: '1'
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          HF_HUB_OFFLINE: '1'
          ENHANCED_LOAD_DOTENV: '0'
          COGNEE_LOG_FILE: 'false'
        run: |
          pytest tests/unit/ -q \
            -p no:cacheprovider \
            --override-ini="addopts=" \
            --junitxml=junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('junit.xml').getroot().iter('testsuite')
          totals = {name: 0 for name in ('tests', 'failures', 'errors', 'skipped')}
          for suite in suites:
              for name in totals:
                  totals[name] += int(suite.get(name, 0))
          assert totals['tests'] > 0 and not any(totals[n] for n in ('failures', 'errors', 'skipped')), totals
          print('Complete unit lane:', totals)
          PY

      - name: Test legacy fresh-install and upgrade fixtures
        env:
          RNR_QUALIFICATION_SCHEMA_URL: postgresql://postgres:synthetic-schema-qualification-only@127.0.0.1:5432/cognee_schema_qualification
          COGNEE_TELEMETRY_ENABLED: '0'
          ENHANCED_LOAD_DOTENV: '0'
          COGNEE_LOG_FILE: 'false'
        run: |
          pytest tests/integration/test_legacy_schema_qualification.py -q -p no:cacheprovider --override-ini="addopts=" --junitxml=schema-qualification.xml

      - name: Test upstream settings and configuration ownership
        env:
          PYTHONPATH: tests/support/network_guard
          COGNEE_TELEMETRY_ENABLED: '0'
          COGNEE_LOG_FILE: 'false'
          ENHANCED_LOAD_DOTENV: '0'
          HF_HUB_OFFLINE: '1'
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          pytest cognee/tests/api/test_settings_security.py -q -p no:cacheprovider --override-ini="addopts=" -W ignore::pydantic.warnings.PydanticDeprecatedSince20 --junitxml=upstream-security.xml

      - name: Prepare isolated canonical memory test runtime and public search model
        env:
          RNR_QUALIFICATION_MODEL_CACHE: ${{ runner.temp }}/cognee-model-cache
          COGNEE_TELEMETRY_ENABLED: '0'
          COGNEE_LOG_FILE: 'false'
          ENHANCED_LOAD_DOTENV: '0'
        run: |
          python -m venv "$RUNNER_TEMP/cognee-memory-tests"
          "$RUNNER_TEMP/cognee-memory-tests/bin/python" -m pip install --require-hashes -r requirements-build.lock
          "$RUNNER_TEMP/cognee-memory-tests/bin/python" -m pip install --require-hashes -r requirements-index.lock -r requirements-memory-mcp.lock -r requirements-memory-test.lock
          "$RUNNER_TEMP/cognee-memory-tests/bin/python" -m pip check
          "$RUNNER_TEMP/cognee-memory-tests/bin/python" scripts/qualification/prepare_text_model.py --cache "$RNR_QUALIFICATION_MODEL_CACHE"

      - name: Test canonical memory, adapters, worker recovery and actual MCP protocol
        env:
          RNR_QUALIFICATION_DATABASE_URL: postgresql://postgres:synthetic-schema-qualification-only@127.0.0.1:5432/cognee_schema_qualification
          RNR_QUALIFICATION_MODEL_CACHE: ${{ runner.temp }}/cognee-model-cache
          HF_HUB_OFFLINE: '1'
          COGNEE_TELEMETRY_ENABLED: '0'
          ENHANCED_LOAD_DOTENV: '0'
          COGNEE_LOG_FILE: 'false'
        run: |
          "$RUNNER_TEMP/cognee-memory-tests/bin/python" -m pytest tests/qualification/test_memory_service_postgres.py tests/qualification/test_memory_evidence.py tests/qualification/test_memory_key_rotation.py tests/qualification/test_selected_capture_and_library.py tests/qualification/test_hermes_provider_contract.py tests/qualification/test_hermes_operator_upgrade.py tests/qualification/test_memory_daemon.py tests/qualification/test_memory_reviewer.py tests/qualification/test_bot_fleet.py tests/qualification/test_selected_recall_bookkeeping.py tests/qualification/test_index_pipeline.py tests/qualification/test_canonical_adapters.py tests/qualification/test_project_memory_mcp.py -q -p no:cacheprovider --override-ini="addopts=" --junitxml=canonical-qualification.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('canonical-qualification.xml').getroot().iter('testsuite'))
          assert suites and sum(int(s.get('tests', 0)) for s in suites) > 0
          assert not any(int(s.get(n, 0)) for s in suites for n in ('failures', 'errors', 'skipped'))
          PY

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            junit.xml
            schema-qualification.xml
            upstream-security.xml
            canonical-qualification.xml
          retention-days: 14
          if-no-files-found: ignore
