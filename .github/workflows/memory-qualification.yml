name: Project memory qualification

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-qualification-only
          POSTGRES_DB: cognee_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RNR_QUALIFICATION_DATABASE_URL: postgresql://postgres:synthetic-qualification-only@127.0.0.1:5432/cognee_qualification
      RNR_QUALIFICATION_MODEL_CACHE: /tmp/cognee-model-cache
      COGNEE_TELEMETRY_ENABLED: '0'
      COGNEE_LOG_FILE: 'false'
      ENHANCED_LOAD_DOTENV: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install free operator backup tools
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked memory-service dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-memory.lock
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 pip-audit==2.9.0
      - name: Audit locked service dependencies
        run: |
          pip-audit -r requirements-build.lock --require-hashes --disable-pip
          pip-audit -r requirements-memory.lock --require-hashes --disable-pip
      - name: Prepare free local search model
        run: |
          python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5', cache_dir='/tmp/cognee-model-cache', threads=2)"
      - name: Run real database, local recall and provider contract checks
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          python -m pytest tests/qualification/ tests/unit/test_capability_boundaries.py tests/unit/test_sqlite_text_cache.py -q -p no:cacheprovider --override-ini=addopts= --junitxml=memory-qualification.xml
      - name: Build restricted service image
        run: docker build -f docker/Dockerfile.memory -t rnr-cognee-memory:qualification .
      - name: Provision matching canonical schema as operator
        env:
          ENHANCED_MEMORY_DATABASE_URL: postgresql://postgres:synthetic-qualification-only@127.0.0.1:5432/cognee_qualification
        run: python -m src.memory_admin init-schema
      - name: Exercise the built image with invented records
        env:
          ENHANCED_ENV: production
          ENHANCED_REQUIRE_TENANT: '1'
          ENHANCED_MEMORY_DATABASE_URL: postgresql://postgres:synthetic-qualification-only@127.0.0.1:5432/cognee_qualification
          ENHANCED_JWT_SECRET: synthetic-ci-container-key-at-least-32-bytes
          ENCRYPTION_MASTER_KEY: cXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXE=
          RNR_QUALIFICATION_SERVICE_URL: http://127.0.0.1:8080
          RNR_QUALIFICATION_JWT_SECRET: synthetic-ci-container-key-at-least-32-bytes
        run: |
          docker run -d --name cognee-memory-qualification --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --memory 768m -e ENHANCED_ENV -e ENHANCED_REQUIRE_TENANT -e ENHANCED_MEMORY_DATABASE_URL -e ENHANCED_JWT_SECRET -e ENCRYPTION_MASTER_KEY rnr-cognee-memory:qualification
          python tests/qualification/container_smoke.py
      - name: Gate high and critical container findings
        run: |
          docker run --name memory-image-scanner -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --image-src docker --scanners vuln --disable-telemetry --timeout 10m --severity HIGH,CRITICAL --exit-code 1 --format json rnr-cognee-memory:qualification > memory-image-vulnerabilities.json
      - name: Upload qualification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-qualification
          path: |
            memory-qualification.xml
            memory-image-vulnerabilities.json
