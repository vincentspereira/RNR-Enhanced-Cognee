[Service]
# E4 v3 (2026-11-06): adds CapabilityBoundingSet for the ledger backup step.
# Root cause of v2 failure: the parent unit sets an EMPTY CapabilityBoundingSet,
# so even root lacks CAP_DAC_OVERRIDE and cannot read the 0600 ledger file owned
# by the API dynamic user (journal 2026-11-06 17:08:12 EACCES). Drop-ins replace
# the whole directive, so we re-grant ONLY the two read-side DAC capabilities.
# ProtectSystem=strict still mounts everything read-only except
# ReadWritePaths=/var/backups/enhanced-cognee - the step gains the ability to
# READ protected files, not to write anywhere new.
CapabilityBoundingSet=CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH
ExecStart=
ExecStart=/opt/enhanced-cognee-memory/runtime/bin/python -m src.memory_daemon backup
ExecStart=/usr/bin/python3 -I -S -B /opt/enhanced-cognee-memory/cutover/ledger_tools_20261105.py backup --ledger /var/lib/enhanced-cognee-llm-budget/tokens.sqlite3 --output-dir /var/backups/enhanced-cognee
