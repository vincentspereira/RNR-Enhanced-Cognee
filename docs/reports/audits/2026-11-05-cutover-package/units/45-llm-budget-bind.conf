# as a symlink in the unit namespace (real dir lives at /var/lib/private/...).
# src/llm_budget.py _secure_path correctly refuses symlinked ledger paths, so the
# ledger was never created (incident 2026-11-06 15:04). Bind the real private dir
# over the symlink path so the app sees a genuine private directory. No code change.
BindPaths=/var/lib/private/enhanced-cognee-llm-budget:/var/lib/enhanced-cognee-llm-budget
